services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-plate}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plate} -d ${POSTGRES_DB:-plate}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      # Ghi đè URL trong .env: trong mạng Docker, DB có tên host là "db" (không phải localhost)
      PLATE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-plate}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-plates}
    depends_on:
      db:
        condition: service_healthy #cho db san sang roi moi khoi dong api
    volumes:
      - ./models:/app/models:ro                 # weights YOLO mount từ ngoài vào
      - easyocr_cache:/home/appuser/.EasyOCR    # cache model OCR, khỏi tải lại
    restart: unless-stopped

volumes:
  easyocr_cache:
  pgdata: